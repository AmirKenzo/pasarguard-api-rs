[package]
name = "pasarguard-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Typed async Rust client for the PasarGuard panel API (reqwest + serde)"
license = "MIT"
repository = "https://github.com/AmirKenzo/pasarguard-api-rs"
readme = "README.md"
keywords = ["pasarguard", "vpn", "panel", "api", "client"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "pasarguard_api"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.41", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "deflate", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
